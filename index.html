<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安徽师范大学计算机与信息学院</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 粒子背景画布 */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 内容层 */
        .content {
            position: relative;
            z-index: 1;
            padding: 40px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 主标题 */
        h1.main-title {
            color: #38bdf8;
            text-shadow: 0 0 20px #38bdf8, 0 0 40px rgba(56, 189, 248, 0.5);
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: fadeInDown 1s ease-out, glowBlue 2s ease-in-out infinite alternate;
            letter-spacing: 3px;
        }

        /* 副标题 */
        h2.sub-title {
            color: #ff007c;
            text-shadow: 0 0 10px #ff007c, 0 0 30px rgba(255, 0, 124, 0.4);
            font-size: 1.5rem;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out 0.3s both, pulsePink 2s ease-in-out infinite;
        }

        /* 图片网格 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 35px;
            margin: 0 auto 50px;
            max-width: 1000px;
            padding: 0 20px;
        }

        .img-card {
            position: relative;
            display: inline-block;
            animation: fadeInUp 0.8s ease-out both;
        }

        .img-card:nth-child(1) { animation-delay: 0.1s; }
        .img-card:nth-child(2) { animation-delay: 0.2s; }
        .img-card:nth-child(3) { animation-delay: 0.3s; }
        .img-card:nth-child(4) { animation-delay: 0.4s; }
        .img-card:nth-child(5) { animation-delay: 0.5s; }
        .img-card:nth-child(6) { animation-delay: 0.6s; }

        .img-card img {
            border-radius: 50%;
            border: 4px solid white;
            width: 280px;
            height: 280px;
            object-fit: cover;
            box-shadow: 0 0 30px #38bdf8, 0 0 60px rgba(56, 189, 248, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: block;
        }

        .img-card:hover img {
            transform: scale(1.1) rotate(3deg);
            box-shadow: 0 0 50px #38bdf8, 0 0 100px rgba(56, 189, 248, 0.4), 0 0 150px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        /* 图片悬停光晕环 */
        .img-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .img-card:hover::before {
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
            animation: spin 10s linear infinite;
        }

        /* 底部链接区域 */
        .enter-link {
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            border-radius: 50px;
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid rgba(0, 255, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .enter-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 0, 0.1);
            transition: left 0.5s ease;
        }

        .enter-link:hover::before {
            left: 100%;
        }

        .enter-link:hover {
            border-color: #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3), 0 0 60px rgba(0, 255, 0, 0.1);
            transform: translateY(-3px);
        }

        .enter-link h1 {
            animation: move 1.5s ease-in-out infinite alternate, glowGreen 1.5s ease-in-out infinite alternate;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 80px rgba(0, 255, 0, 0.5);
            font-size: 1.5rem;
            white-space: nowrap;
        }

        /* 装饰分隔线 */
        .divider {
            width: 200px;
            height: 2px;
            margin: 30px auto;
            background: rgba(56, 189, 248, 0.3);
            position: relative;
            overflow: hidden;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #38bdf8;
            animation: slideLine 3s ease-in-out infinite;
        }

        /* 动画定义 */
        @keyframes move {
            0% { transform: translateX(20px); }
            100% { transform: translateX(-20px); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes glowBlue {
            from { text-shadow: 0 0 20px #38bdf8, 0 0 40px rgba(56, 189, 248, 0.5); }
            to { text-shadow: 0 0 30px #38bdf8, 0 0 60px rgba(56, 189, 248, 0.7), 0 0 90px rgba(56, 189, 248, 0.4); }
        }

        @keyframes glowGreen {
            from { text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00; }
            to { text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00, 0 0 100px rgba(0, 255, 0, 0.6); }
        }

        @keyframes pulsePink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes slideLine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
            .img-card img {
                width: 220px;
                height: 220px;
            }
            h1.main-title { font-size: 1.8rem; }
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .img-card img {
                width: 160px;
                height: 160px;
                border-width: 3px;
            }
            h1.main-title { font-size: 1.4rem; letter-spacing: 1px; }
            h2.sub-title { font-size: 1.1rem; }
            .enter-link h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="content">
        <h1 class="main-title">安徽师范大学计算机与信息学院</h1>
        <h2 class="sub-title">学院官方网站!!!</h2>
        <div class="divider"></div>

        <div class="gallery">
            <div class="img-card">
                <img src="head.jpg" alt="作者">
            </div>
            <div class="img-card">
                <img src="head2.jpg" alt="学院风采">
            </div>
            <div class="img-card">
                <img src="head3.jpg" alt="学院风采">
            </div>
            <div class="img-card">
                <img src="head4.jpg" alt="学院风采">
            </div>
            <div class="img-card">
                <img src="head5.jpg" alt="学院风采">
            </div>
            <div class="img-card">
                <img src="head6.jpg" alt="学院风采">
            </div>
        </div>

        <a href=" https://ci.ahnu.edu.cn" class="enter-link">
            <h1>~~~ 我所在的学院，点击进入 ~~~</h1>
        </a >
    </div>

    <script>
        // 粒子背景
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        let particles = [];
        const count = 60;
        const connectDist = 120;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.r = Math.random() * 2 + 1;
                this.alpha = Math.random() * 0.4 + 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > w) this.vx *= -1;
                if (this.y < 0 || this.y > h) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < connectDist) {
                        const a = (1 - dist / connectDist) * 0.15;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(56, 189, 248, ${a})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => { p.update(); p.draw(); });
            drawLines();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resize(); init(); });
        resize();
        init();
        animate();

        // 鼠标交互
        document.addEventListener('mousemove', (e) => {
            particles.forEach(p => {
                const dx = e.clientX - p.x;
                const dy = e.clientY - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) {
                    p.vx += dx * 0.0002;
                    p.vy += dy * 0.0002;
                }
            });
        });
    </script>
</body>
</html>
